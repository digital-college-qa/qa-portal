<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="370" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Әріптес қайталай ала ма?</text><rect x="24.0" y="88" width="446.0" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44.0" y="126" font-size="26" font-weight="700" fill="#a42f38">Деректер жетіспейді</text><text x="44.0" y="180" font-size="26" font-weight="400" fill="#202637">Сусын қосу.</text><rect x="490.0" y="88" width="446.0" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="510.0" y="126" font-size="26" font-weight="700" fill="#196747">Қайталауға болады</text><text x="510.0" y="180" font-size="26" font-weight="400" fill="#202637">Латтені таңдау. Саны 2.</text><text x="510.0" y="215" font-size="26" font-weight="400" fill="#202637">«Себетке» басу.</text><text x="24" y="338" font-size="24" font-weight="700" fill="#6241a5">Әріптесте сол деректер → сол тексеруді қайталай алады.</text></svg>

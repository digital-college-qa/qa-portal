<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="432" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Образец: неверная цена не сохранилась</text><text x="24" y="96" font-size="24" font-weight="700" fill="#6241a5">До начала: POST /session/reset → 200.</text><rect x="24.0" y="120" width="446.0" height="218" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42.0" y="156" font-size="25" font-weight="700" fill="#6241a5">PATCH /products/4</text><text x="42.0" y="194" font-size="24" font-weight="700" fill="#a42f38">price: 100001</text><text x="42.0" y="232" font-size="24" font-weight="700" fill="#a42f38">HTTP 400</text><text x="42.0" y="270" font-size="24" font-weight="400" fill="#566078">error.code:</text><text x="42.0" y="308" font-size="24" font-weight="700" fill="#a42f38">INVALID_PRICE</text><rect x="490.0" y="120" width="446.0" height="142" rx="16" fill="#fff" stroke="#d9deeb"/><text x="508.0" y="156" font-size="25" font-weight="700" fill="#6241a5">GET /products/4</text><text x="508.0" y="194" font-size="24" font-weight="700" fill="#196747">HTTP 200</text><text x="508.0" y="232" font-size="24" font-weight="700" fill="#202637">price: 1300</text><text x="24" y="368" font-size="24" font-weight="700" fill="#196747">Ожидали отказ. Цена осталась 1300 → Passed.</text><text x="24" y="400" font-size="24" font-weight="700" fill="#6241a5">400 относится к неверному запросу; проверка состояния вернула 200.</text></svg>

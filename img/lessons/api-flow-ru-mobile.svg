<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 859" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="859" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Как браузер получает</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">меню через API</text><rect x="24" y="127" width="352" height="156" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="161" font-size="27" font-weight="700" fill="#6241a5">Браузер</text><rect x="44" y="192" width="94" height="62" rx="8" fill="#f1edf9" stroke="#6241a5"/><path d="M44 207h94 M70 264h42 M91 254v10" stroke="#6241a5" stroke-width="3" fill="none"/><text x="158" y="217" font-size="24" font-weight="700" fill="#202637">Хочу увидеть</text><text x="158" y="250" font-size="24" font-weight="700" fill="#202637">меню</text><path d="M200.0 285v14m-5-5 5 5 5-5" stroke="#6241a5" stroke-width="3" fill="none"/><rect x="24" y="303" width="352" height="156" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="337" font-size="27" font-weight="700" fill="#6241a5">API</text><rect x="58" y="363" width="64" height="76" rx="8" fill="#f1edf9" stroke="#6241a5"/><text x="68" y="400" font-size="28" font-weight="700" fill="#6241a5">{ }</text><path d="M70 416h38 M70 426h28" stroke="#6241a5" stroke-width="3"/><text x="158" y="393" font-size="24" font-weight="700" fill="#202637">GET /products</text><path d="M200.0 461v14m-5-5 5 5 5-5" stroke="#6241a5" stroke-width="3" fill="none"/><rect x="24" y="479" width="352" height="156" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="513" font-size="27" font-weight="700" fill="#6241a5">Сервер</text><rect x="44" y="544" width="94" height="18" rx="5" fill="#e5f1e9" stroke="#196747"/><circle cx="124" cy="553" r="3" fill="#196747"/><rect x="44" y="567" width="94" height="18" rx="5" fill="#e5f1e9" stroke="#196747"/><circle cx="124" cy="576" r="3" fill="#196747"/><rect x="44" y="590" width="94" height="18" rx="5" fill="#e5f1e9" stroke="#196747"/><circle cx="124" cy="599" r="3" fill="#196747"/><text x="158" y="569" font-size="24" font-weight="700" fill="#202637">Готовлю</text><text x="158" y="602" font-size="24" font-weight="700" fill="#202637">каталог</text><text x="24" y="663" font-size="24" font-weight="700" fill="#196747">Ответ обратно в браузер:</text><text x="24" y="696" font-size="24" font-weight="700" fill="#196747">200 + данные каталога.</text><text x="24" y="728" font-size="24" font-weight="700" fill="#6241a5">API задаёт правила</text><text x="24" y="761" font-size="24" font-weight="700" fill="#6241a5">общения: что можно</text><text x="24" y="794" font-size="24" font-weight="700" fill="#6241a5">запросить и какой ответ</text><text x="24" y="827" font-size="24" font-weight="700" fill="#6241a5">ждать.</text></svg>

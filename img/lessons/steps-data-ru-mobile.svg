<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="860" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Предусловие,</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">действие, данные</text><text x="24" y="135" font-size="24" font-weight="700" fill="#6241a5">До начала: корзина пуста.</text><rect x="24" y="159" width="352" height="292" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="24" y="159" width="352" height="44" rx="12" fill="#eae4f6" stroke="none"/><text x="40" y="188" font-size="21" font-weight="700" fill="#6241a5">1. Выбор напитка</text><rect x="44" y="225" width="96" height="80" rx="18" fill="#e8efe9" stroke="none"/><path d="M69 254h44v23q0 18-22 18t-22-18z M113 258q25 0 14 20h-14" fill="#fff" stroke="#196747" stroke-width="3"/><path d="M83 245q-8-7 0-14 M99 245q-8-7 0-14" fill="none" stroke="#196747" stroke-width="3"/><text x="162" y="253" font-size="27" font-weight="700" fill="#202637">Латте</text><text x="44" y="345" font-size="25" font-weight="400" fill="#202637">Количество: 2</text><rect x="44" y="374" width="210" height="48" rx="12" fill="#6241a5" stroke="#6241a5"/><text x="58" y="406" font-size="22" font-weight="700" fill="#fff">В корзину</text><rect x="24" y="473" width="352" height="292" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="24" y="473" width="352" height="44" rx="12" fill="#eae4f6" stroke="none"/><text x="40" y="502" font-size="21" font-weight="700" fill="#6241a5">2. Корзина</text><rect x="44" y="539" width="96" height="80" rx="18" fill="#e8efe9" stroke="none"/><path d="M69 568h44v23q0 18-22 18t-22-18z M113 572q25 0 14 20h-14" fill="#fff" stroke="#196747" stroke-width="3"/><path d="M83 559q-8-7 0-14 M99 559q-8-7 0-14" fill="none" stroke="#196747" stroke-width="3"/><text x="162" y="567" font-size="27" font-weight="700" fill="#202637">Латте</text><text x="162" y="606" font-size="28" font-weight="700" fill="#6241a5">× 2</text><text x="44" y="685" font-size="24" font-weight="400" fill="#196747">В корзине два латте</text><text x="24" y="795" font-size="24" font-weight="700" fill="#6241a5">Данные: латте, 2. Шаг:</text><text x="24" y="828" font-size="24" font-weight="700" fill="#6241a5">нажать «В корзину».</text></svg>

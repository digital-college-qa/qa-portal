<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 773" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="480" height="773" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Әсері мен шұғылдығы —</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">бөлек ұғымдар</text><rect x="24" y="127" width="432" height="248" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="165" font-size="30" font-weight="700" fill="#6241a5">Severity</text><text x="44" y="209" font-size="25" font-weight="400" fill="#202637">Қаншалықты кедергі?</text><text x="44" y="247" font-size="29" font-weight="700" fill="#202637">Minor</text><text x="44" y="287" font-size="23" font-weight="400" fill="#566078">Атауда әріп қатесі. Тапсырыс</text><text x="44" y="319" font-size="23" font-weight="400" fill="#566078">жұмыс істейді.</text><rect x="24" y="397" width="432" height="248" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="435" font-size="30" font-weight="700" fill="#6241a5">Priority</text><text x="44" y="479" font-size="25" font-weight="400" fill="#202637">Қаншалықты шұғыл түзету</text><text x="44" y="513" font-size="25" font-weight="400" fill="#202637">керек?</text><text x="44" y="551" font-size="29" font-weight="700" fill="#202637">High</text><text x="44" y="591" font-size="23" font-weight="400" fill="#566078">Ертең жарнама: бүгін түзету керек.</text><text x="24" y="675" font-size="24" font-weight="700" fill="#6241a5">Команда бағасының шартты</text><text x="24" y="708" font-size="24" font-weight="700" fill="#6241a5">мысалы. Minor — міндетті түрде</text><text x="24" y="741" font-size="24" font-weight="700" fill="#6241a5">Low емес.</text></svg>

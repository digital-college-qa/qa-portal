<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 972" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="972" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Бір қате — әртүрлі</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">әсер</text><text x="24" y="135" font-size="24" font-weight="700" fill="#6241a5">Бір қате: іздеу тауарды</text><text x="24" y="168" font-size="24" font-weight="700" fill="#6241a5">атауы бойынша таппайды.</text><rect x="24" y="192" width="352" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="228" font-size="27" font-weight="700" fill="#6241a5">Шағын дүкен</text><text x="44" y="276" font-size="24" font-weight="400" fill="#202637">6 тауар. Бәрі мәзірде</text><text x="44" y="309" font-size="24" font-weight="400" fill="#202637">көрінеді, айналып өту жолы</text><text x="44" y="342" font-size="24" font-weight="400" fill="#202637">бар.</text><text x="44" y="392" font-size="24" font-weight="700" fill="#202637">Severity: Minor</text><text x="44" y="430" font-size="24" font-weight="700" fill="#202637">Priority: Low</text><rect x="24" y="529" width="352" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="565" font-size="27" font-weight="700" fill="#6241a5">Үлкен каталог</text><text x="44" y="613" font-size="24" font-weight="400" fill="#202637">10 000 тауар. Іздеу —</text><text x="44" y="646" font-size="24" font-weight="400" fill="#202637">сатып алудың негізгі жолы.</text><text x="44" y="696" font-size="24" font-weight="700" fill="#202637">Severity: Major</text><text x="44" y="734" font-size="24" font-weight="700" fill="#202637">Priority: High</text><text x="24" y="874" font-size="24" font-weight="700" fill="#6241a5">Бағалар шартты. Алдымен</text><text x="24" y="907" font-size="24" font-weight="700" fill="#6241a5">команда шкаласы мен</text><text x="24" y="940" font-size="24" font-weight="700" fill="#6241a5">ережесін біл.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 900" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="480" height="900" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Бір қате — әртүрлі әсер</text><text x="24" y="96" font-size="24" font-weight="700" fill="#6241a5">Бір қате: іздеу тауарды атауы</text><text x="24" y="129" font-size="24" font-weight="700" fill="#6241a5">бойынша таппайды.</text><rect x="24" y="153" width="432" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="189" font-size="27" font-weight="700" fill="#6241a5">Шағын дүкен</text><text x="44" y="237" font-size="24" font-weight="400" fill="#202637">6 тауар. Бәрі мәзірде көрінеді,</text><text x="44" y="270" font-size="24" font-weight="400" fill="#202637">айналып өту жолы бар.</text><text x="44" y="320" font-size="24" font-weight="700" fill="#202637">Severity: Minor</text><text x="44" y="358" font-size="24" font-weight="700" fill="#202637">Priority: Low</text><rect x="24" y="490" width="432" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="526" font-size="27" font-weight="700" fill="#6241a5">Үлкен каталог</text><text x="44" y="574" font-size="24" font-weight="400" fill="#202637">10 000 тауар. Іздеу — сатып</text><text x="44" y="607" font-size="24" font-weight="400" fill="#202637">алудың негізгі жолы.</text><text x="44" y="657" font-size="24" font-weight="700" fill="#202637">Severity: Major</text><text x="44" y="695" font-size="24" font-weight="700" fill="#202637">Priority: High</text><text x="24" y="835" font-size="24" font-weight="700" fill="#6241a5">Бағалар шартты. Алдымен команда</text><text x="24" y="868" font-size="24" font-weight="700" fill="#6241a5">шкаласы мен ережесін біл.</text></svg>

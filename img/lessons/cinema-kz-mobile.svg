<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 893" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="480" height="893" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Мысалдағы баг: «Дюна»</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">іздеуі</text><rect x="24" y="127" width="432" height="292" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="24" y="127" width="432" height="44" rx="12" fill="#eae4f6" stroke="none"/><text x="40" y="156" font-size="21" font-weight="700" fill="#6241a5">Оқу кинотеатры · Афиша</text><text x="42" y="201" font-size="20" font-weight="400" fill="#566078">Атауы бойынша іздеу</text><rect x="42" y="213" width="396" height="46" rx="8" fill="#fff" stroke="#d9deeb"/><text x="54" y="244" font-size="23" font-weight="400" fill="#202637">Дюна</text><rect x="42" y="279" width="140" height="48" rx="12" fill="#6241a5" stroke="#6241a5"/><text x="56" y="311" font-size="22" font-weight="700" fill="#fff">Табу</text><text x="42" y="367" font-size="25" font-weight="700" fill="#a42f38">Ештеңе табылмады</text><rect x="24" y="441" width="432" height="292" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="24" y="441" width="432" height="44" rx="12" fill="#eae4f6" stroke="none"/><text x="40" y="470" font-size="21" font-weight="700" fill="#6241a5">Оқу кинотеатры · Афиша</text><text x="42" y="515" font-size="20" font-weight="400" fill="#566078">Атауы бойынша іздеу</text><rect x="42" y="527" width="396" height="46" rx="8" fill="#fff" stroke="#d9deeb"/><text x="54" y="558" font-size="23" font-weight="400" fill="#202637">дюна</text><rect x="42" y="593" width="140" height="48" rx="12" fill="#6241a5" stroke="#6241a5"/><text x="56" y="625" font-size="22" font-weight="700" fill="#fff">Табу</text><text x="42" y="681" font-size="25" font-weight="700" fill="#196747">«Дюна» фильмі табылды</text><text x="24" y="763" font-size="24" font-weight="700" fill="#6241a5">Ереже: іздеу әріп регистріне</text><text x="24" y="796" font-size="24" font-weight="700" fill="#6241a5">тәуелді емес.</text><text x="24" y="828" font-size="24" font-weight="700" fill="#6241a5">Не: фильм табылмады → қайда:</text><text x="24" y="861" font-size="24" font-weight="700" fill="#6241a5">іздеу → «Дюна» енгізген соң.</text></svg>

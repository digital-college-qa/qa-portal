<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="540" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Номер напитка и id строки — разные</text><rect x="24.0" y="88" width="446.0" height="218" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42.0" y="124" font-size="25" font-weight="700" fill="#6241a5">Товар в каталоге</text><text x="42.0" y="162" font-size="24" font-weight="400" fill="#566078">Фрагмент ответа:</text><text x="42.0" y="200" font-size="24" font-weight="700" fill="#202637">&quot;id&quot;: 4</text><text x="42.0" y="238" font-size="24" font-weight="400" fill="#202637">Это номер напитка</text><text x="42.0" y="276" font-size="24" font-weight="400" fill="#202637">4 → Латте</text><rect x="490.0" y="88" width="446.0" height="294" rx="16" fill="#fff" stroke="#d9deeb"/><text x="508.0" y="124" font-size="25" font-weight="700" fill="#6241a5">Строка корзины</text><text x="508.0" y="162" font-size="24" font-weight="400" fill="#566078">Фрагмент ответа:</text><text x="508.0" y="200" font-size="24" font-weight="400" fill="#202637">&quot;items&quot;: [</text><text x="508.0" y="238" font-size="24" font-weight="700" fill="#6241a5">{ &quot;id&quot;: &quot;4-S-0&quot;,</text><text x="508.0" y="276" font-size="24" font-weight="400" fill="#202637">&quot;productId&quot;: 4,</text><text x="508.0" y="314" font-size="24" font-weight="400" fill="#202637">&quot;size&quot;: &quot;S&quot; }</text><text x="508.0" y="352" font-size="24" font-weight="400" fill="#202637">]</text><text x="24" y="412" font-size="24" font-weight="700" fill="#6241a5">↓ Копируем id строки целиком из items</text><text x="24" y="444" font-size="24" font-weight="700" fill="#196747">DELETE /cart/items/4-S-0</text><text x="24" y="476" font-size="24" font-weight="700" fill="#196747">204 → строка удалена. В Postman: /cart/items/{{itemId}}</text><text x="24" y="508" font-size="24" font-weight="700" fill="#6241a5">В нашем клиенте вставляем id вручную; не собираем его наугад.</text></svg>

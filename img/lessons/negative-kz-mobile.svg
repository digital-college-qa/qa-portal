<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 704" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="704" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Дұрыс бас тарту неге</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">Passed</text><rect x="24" y="127" width="352" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="167" font-size="25" font-weight="700" fill="#6241a5">Күтілетін нәтиже</text><text x="44" y="235" font-size="25" font-weight="400" fill="#202637">Аты жоқ тапсырыс</text><text x="44" y="269" font-size="25" font-weight="400" fill="#202637">жасалмайды. Форма</text><text x="44" y="303" font-size="25" font-weight="400" fill="#202637">себебін түсіндіреді.</text><rect x="24" y="379" width="352" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="419" font-size="25" font-weight="700" fill="#6241a5">Нақты нәтиже</text><text x="44" y="487" font-size="25" font-weight="400" fill="#202637">Тапсырыс жасалмады.</text><text x="44" y="521" font-size="25" font-weight="400" fill="#202637">Аттың жанында қате бар.</text><text x="24" y="639" font-size="24" font-weight="700" fill="#196747">Сәйкес келді → Passed. Бас</text><text x="24" y="672" font-size="24" font-weight="700" fill="#196747">тарту күтілді.</text></svg>

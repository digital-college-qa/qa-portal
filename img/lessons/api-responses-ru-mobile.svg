<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 713" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="713" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Ответ API: код и</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">данные</text><rect x="24" y="127" width="352" height="218" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="163" font-size="25" font-weight="700" fill="#6241a5">GET /products/4</text><text x="42" y="201" font-size="24" font-weight="700" fill="#196747">HTTP 200</text><text x="42" y="239" font-size="24" font-weight="400" fill="#202637">id: 4</text><text x="42" y="277" font-size="24" font-weight="400" fill="#202637">name: Латте</text><text x="42" y="315" font-size="24" font-weight="700" fill="#202637">price: 1300</text><rect x="24" y="367" width="352" height="218" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="403" font-size="25" font-weight="700" fill="#6241a5">GET /products/50</text><text x="42" y="441" font-size="24" font-weight="700" fill="#a42f38">HTTP 404</text><text x="42" y="479" font-size="24" font-weight="400" fill="#202637">Такого напитка нет</text><text x="42" y="517" font-size="24" font-weight="400" fill="#566078">error.code:</text><text x="42" y="555" font-size="24" font-weight="700" fill="#a42f38">PRODUCT_NOT_FOUND</text><text x="24" y="615" font-size="24" font-weight="700" fill="#6241a5">Читаем и код, и данные. Для</text><text x="24" y="648" font-size="24" font-weight="700" fill="#6241a5">отсутствующего товара 404</text><text x="24" y="681" font-size="24" font-weight="700" fill="#6241a5">ожидаем.</text></svg>

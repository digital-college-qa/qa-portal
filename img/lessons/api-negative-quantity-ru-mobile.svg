<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 881" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="881" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Неверное количество:</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">отказ и пустая корзина</text><text x="24" y="135" font-size="24" font-weight="700" fill="#6241a5">До начала: POST</text><text x="24" y="168" font-size="24" font-weight="700" fill="#6241a5">/session/reset → 200.</text><rect x="24" y="192" width="352" height="256" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="228" font-size="25" font-weight="700" fill="#6241a5">POST /cart/items</text><text x="42" y="266" font-size="24" font-weight="700" fill="#a42f38">quantity: 0</text><text x="42" y="304" font-size="24" font-weight="400" fill="#202637">productId: 4 · size: M</text><text x="42" y="342" font-size="24" font-weight="700" fill="#a42f38">HTTP 400</text><text x="42" y="380" font-size="24" font-weight="400" fill="#566078">error.code:</text><text x="42" y="418" font-size="24" font-weight="700" fill="#a42f38">INVALID_QUANTITY</text><rect x="24" y="470" width="352" height="218" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="506" font-size="25" font-weight="700" fill="#6241a5">GET /cart</text><text x="42" y="544" font-size="24" font-weight="700" fill="#196747">HTTP 200</text><text x="42" y="582" font-size="24" font-weight="700" fill="#202637">items: []</text><text x="42" y="620" font-size="24" font-weight="400" fill="#202637">quantity: 0</text><text x="42" y="658" font-size="24" font-weight="400" fill="#202637">subtotal: 0</text><text x="24" y="718" font-size="24" font-weight="700" fill="#196747">Ожидали отказ. Корзина</text><text x="24" y="751" font-size="24" font-weight="700" fill="#196747">осталась пустой → Passed.</text><text x="24" y="783" font-size="24" font-weight="700" fill="#6241a5">400 относится к неверному</text><text x="24" y="816" font-size="24" font-weight="700" fill="#6241a5">запросу; проверка</text><text x="24" y="849" font-size="24" font-weight="700" fill="#6241a5">состояния вернула 200.</text></svg>

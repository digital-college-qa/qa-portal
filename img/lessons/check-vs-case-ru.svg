<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="450" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Чек-лист и тест-кейс: одна проверка</text><rect x="24.0" y="88" width="446.0" height="300" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44.0" y="126" font-size="28" font-weight="700" fill="#6241a5">Чек-лист</text><text x="44.0" y="176" font-size="24" font-weight="400" fill="#202637">Ссылка «← В меню»</text><text x="44.0" y="218" font-size="24" font-weight="400" fill="#202637">открывает меню — Passed</text><rect x="490.0" y="88" width="446.0" height="300" rx="16" fill="#fff" stroke="#d9deeb"/><text x="510.0" y="126" font-size="28" font-weight="700" fill="#6241a5">Тест-кейс</text><text x="510.0" y="176" font-size="24" font-weight="400" fill="#202637">1. Открыть латте</text><text x="510.0" y="218" font-size="24" font-weight="400" fill="#202637">2. Нажать «← В меню»</text><text x="510.0" y="260" font-size="24" font-weight="400" fill="#202637">Ожидали: откроется меню</text><text x="510.0" y="302" font-size="24" font-weight="400" fill="#202637">Увидели: меню открылось</text><text x="24" y="418" font-size="24" font-weight="700" fill="#6241a5">Одна проверка. В кейсе — ещё и как её повторить.</text></svg>

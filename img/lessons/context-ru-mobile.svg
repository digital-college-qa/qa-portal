<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 972" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="972" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Одинаковая ошибка —</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">разное влияние</text><text x="24" y="135" font-size="24" font-weight="700" fill="#6241a5">Одна ошибка: поиск не</text><text x="24" y="168" font-size="24" font-weight="700" fill="#6241a5">находит товар по названию.</text><rect x="24" y="192" width="352" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="228" font-size="27" font-weight="700" fill="#6241a5">Маленький магазин</text><text x="44" y="276" font-size="24" font-weight="400" fill="#202637">6 товаров. Все видны в</text><text x="44" y="309" font-size="24" font-weight="400" fill="#202637">меню, есть обходной путь.</text><text x="44" y="359" font-size="24" font-weight="700" fill="#202637">Severity: Minor</text><text x="44" y="397" font-size="24" font-weight="700" fill="#202637">Priority: Low</text><rect x="24" y="529" width="352" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="565" font-size="27" font-weight="700" fill="#6241a5">Большой каталог</text><text x="44" y="613" font-size="24" font-weight="400" fill="#202637">10 000 товаров. Поиск —</text><text x="44" y="646" font-size="24" font-weight="400" fill="#202637">основной путь к покупке.</text><text x="44" y="696" font-size="24" font-weight="700" fill="#202637">Severity: Major</text><text x="44" y="734" font-size="24" font-weight="700" fill="#202637">Priority: High</text><text x="24" y="874" font-size="24" font-weight="700" fill="#6241a5">Оценки условные. Сначала</text><text x="24" y="907" font-size="24" font-weight="700" fill="#6241a5">узнай шкалу и правила</text><text x="24" y="940" font-size="24" font-weight="700" fill="#6241a5">команды.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="360" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Как уточнить слово «быстро»</text><rect x="24.0" y="88" width="446.0" height="210" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44.0" y="126" font-size="25" font-weight="700" fill="#6241a5">Учебное требование REV-2</text><text x="44.0" y="192" font-size="27" font-weight="400" fill="#202637">«Результаты показываются</text><text x="44.0" y="228" font-size="27" font-weight="400" fill="#202637">быстро».</text><rect x="490.0" y="88" width="446.0" height="210" rx="16" fill="#fff" stroke="#d9deeb"/><text x="510.0" y="126" font-size="25" font-weight="700" fill="#6241a5">Вопрос автору</text><text x="510.0" y="192" font-size="27" font-weight="400" fill="#202637">За сколько секунд должны</text><text x="510.0" y="228" font-size="27" font-weight="400" fill="#202637">появиться результаты?</text><text x="24" y="328" font-size="24" font-weight="700" fill="#6241a5">Число уточняем у автора. Не придумываем сами.</text></svg>

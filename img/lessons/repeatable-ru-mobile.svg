<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 717" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="717" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Коллега сможет</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">повторить?</text><rect x="24" y="127" width="352" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="165" font-size="26" font-weight="700" fill="#a42f38">Не хватает данных</text><text x="44" y="219" font-size="26" font-weight="400" fill="#202637">Добавить напиток.</text><rect x="24" y="369" width="352" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="407" font-size="26" font-weight="700" fill="#196747">Можно повторить</text><text x="44" y="461" font-size="26" font-weight="400" fill="#202637">Выбрать латте.</text><text x="44" y="496" font-size="26" font-weight="400" fill="#202637">Количество 2. Нажать «В</text><text x="44" y="531" font-size="26" font-weight="400" fill="#202637">корзину».</text><text x="24" y="619" font-size="24" font-weight="700" fill="#6241a5">У коллеги те же данные → ту</text><text x="24" y="652" font-size="24" font-weight="700" fill="#6241a5">же проверку можно</text><text x="24" y="685" font-size="24" font-weight="700" fill="#6241a5">повторить.</text></svg>

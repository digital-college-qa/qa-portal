<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 645" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="480" height="645" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Коллега сможет повторить?</text><rect x="24" y="88" width="432" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="126" font-size="26" font-weight="700" fill="#a42f38">Не хватает данных</text><text x="44" y="180" font-size="26" font-weight="400" fill="#202637">Добавить напиток.</text><rect x="24" y="330" width="432" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="368" font-size="26" font-weight="700" fill="#196747">Можно повторить</text><text x="44" y="422" font-size="26" font-weight="400" fill="#202637">Выбрать латте. Количество 2.</text><text x="44" y="457" font-size="26" font-weight="400" fill="#202637">Нажать «В корзину».</text><text x="24" y="580" font-size="24" font-weight="700" fill="#6241a5">У коллеги те же данные → ту же</text><text x="24" y="613" font-size="24" font-weight="700" fill="#6241a5">проверку можно повторить.</text></svg>

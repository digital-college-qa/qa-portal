<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="398" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Әсері мен шұғылдығы — бөлек ұғымдар</text><rect x="24.0" y="88" width="446.0" height="248" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44.0" y="126" font-size="30" font-weight="700" fill="#6241a5">Severity</text><text x="44.0" y="170" font-size="25" font-weight="400" fill="#202637">Қаншалықты кедергі?</text><text x="44.0" y="208" font-size="29" font-weight="700" fill="#202637">Minor</text><text x="44.0" y="248" font-size="23" font-weight="400" fill="#566078">Атауда әріп қатесі. Тапсырыс жұмыс</text><text x="44.0" y="280" font-size="23" font-weight="400" fill="#566078">істейді.</text><rect x="490.0" y="88" width="446.0" height="248" rx="16" fill="#fff" stroke="#d9deeb"/><text x="510.0" y="126" font-size="30" font-weight="700" fill="#6241a5">Priority</text><text x="510.0" y="170" font-size="25" font-weight="400" fill="#202637">Қаншалықты шұғыл түзету керек?</text><text x="510.0" y="208" font-size="29" font-weight="700" fill="#202637">High</text><text x="510.0" y="248" font-size="23" font-weight="400" fill="#566078">Ертең жарнама: бүгін түзету керек.</text><text x="24" y="366" font-size="24" font-weight="700" fill="#6241a5">Команда бағасының шартты мысалы. Minor — міндетті түрде Low емес.</text></svg>

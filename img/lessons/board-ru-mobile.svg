<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 892" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="892" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Как выглядит доска</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">трекера</text><rect x="24" y="127" width="352" height="110" rx="16" fill="#eae4f6" stroke="#d9deeb"/><text x="42" y="161" font-size="25" font-weight="700" fill="#6241a5">Новые</text><text x="42" y="205" font-size="24" font-weight="400" fill="#202637">BUG-SRC-001 · New</text><rect x="24" y="251" width="352" height="110" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="285" font-size="25" font-weight="700" fill="#6241a5">В работе</text><text x="42" y="329" font-size="24" font-weight="400" fill="#202637">In Progress</text><rect x="24" y="375" width="352" height="110" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="409" font-size="25" font-weight="700" fill="#6241a5">На проверке</text><text x="42" y="453" font-size="24" font-weight="400" fill="#202637">Fixed → Retest</text><rect x="24" y="499" width="352" height="110" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="533" font-size="25" font-weight="700" fill="#6241a5">Готово</text><text x="42" y="577" font-size="24" font-weight="400" fill="#202637">Closed</text><text x="24" y="631" font-size="24" font-weight="700" fill="#6241a5">Карточка BUG-SRC-001:</text><text x="24" y="664" font-size="24" font-weight="700" fill="#6241a5">«Дюна» не находится в</text><text x="24" y="697" font-size="24" font-weight="700" fill="#6241a5">поиске.</text><text x="24" y="729" font-size="24" font-weight="700" fill="#6241a5">Исполнитель: тестировщик ·</text><text x="24" y="762" font-size="24" font-weight="700" fill="#6241a5">Severity: Major · статус: New</text><text x="24" y="794" font-size="24" font-weight="700" fill="#6241a5">Колонки условные. Fixed →</text><text x="24" y="827" font-size="24" font-weight="700" fill="#6241a5">проверка → Closed или</text><text x="24" y="860" font-size="24" font-weight="700" fill="#6241a5">Reopened.</text></svg>

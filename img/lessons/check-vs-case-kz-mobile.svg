<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 844" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="844" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Чек-лист пен тест-кейс:</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">бір тексеру</text><rect x="24" y="127" width="352" height="300" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="165" font-size="28" font-weight="700" fill="#6241a5">Чек-лист</text><text x="44" y="215" font-size="24" font-weight="400" fill="#202637">«← Мәзірге» сілтемесі</text><text x="44" y="257" font-size="24" font-weight="400" fill="#202637">мәзірді ашады — Passed</text><rect x="24" y="449" width="352" height="300" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="487" font-size="28" font-weight="700" fill="#6241a5">Тест-кейс</text><text x="44" y="537" font-size="24" font-weight="400" fill="#202637">1. Латтені ашу</text><text x="44" y="579" font-size="24" font-weight="400" fill="#202637">2. «← Мәзірге» басу</text><text x="44" y="621" font-size="24" font-weight="400" fill="#202637">Күттік: мәзір ашылады</text><text x="44" y="663" font-size="24" font-weight="400" fill="#202637">Көрдік: мәзір ашылды</text><text x="24" y="779" font-size="24" font-weight="700" fill="#6241a5">Бір тексеру. Кейсте оны</text><text x="24" y="812" font-size="24" font-weight="700" fill="#6241a5">қайталау жолы да бар.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="380" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Күту мен нақты нәтижені салыстырамыз</text><rect x="24.0" y="88" width="446.0" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44.0" y="124" font-size="22" font-weight="700" fill="#6241a5">Оқу ережесі</text><text x="44.0" y="164" font-size="25" font-weight="700" fill="#202637">Сілтеме мәзірді ашады</text><text x="44.0" y="207" font-size="22" font-weight="400" fill="#566078">Басқаннан кейін:</text><text x="44.0" y="248" font-size="25" font-weight="700" fill="#202637">Мәзір ашылды</text><text x="44.0" y="292" font-size="27" font-weight="700" fill="#196747">Passed</text><rect x="490.0" y="88" width="446.0" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="510.0" y="124" font-size="22" font-weight="700" fill="#6241a5">Оқу ережесі</text><text x="510.0" y="164" font-size="25" font-weight="700" fill="#202637">Сілтеме мәзірді ашады</text><text x="510.0" y="207" font-size="22" font-weight="400" fill="#566078">Басқаннан кейін:</text><text x="510.0" y="248" font-size="25" font-weight="700" fill="#202637">Басты бет ашылды</text><text x="510.0" y="292" font-size="27" font-weight="700" fill="#a42f38">Failed</text><text x="24" y="348" font-size="24" font-weight="700" fill="#6241a5">Мәртебе — әсер емес, салыстыру нәтижесі.</text></svg>

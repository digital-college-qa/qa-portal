<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img"><title>Smoke және sanity</title><rect width="1040" height="650" rx="20" fill="#f7f5fc"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#29263e} .mono{font-family:Consolas,monospace}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#7650ba"/></marker></defs><text x="32" y="40.0" style="fill:#7650ba" font-size="16" font-weight="700">ОҚУ СЫЗБАСЫ · QA PORTAL</text><text x="32" y="78.0" style="fill:#29263e" font-size="27" font-weight="700">Smoke және sanity</text><rect x="35" y="145" width="475" height="190" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="55" y="188.0" style="fill:#7650ba" font-size="25" font-weight="700">Не және қалай?</text><text x="55" y="236.0" style="fill:#29263e" font-size="23" font-weight="400">Функция: тауар қосылды.</text><text x="55" y="267.05" style="fill:#29263e" font-size="23" font-weight="400">Сапа: жылдам әрі ыңғайлы.</text><rect x="540" y="145" width="475" height="190" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="560" y="188.0" style="fill:#7650ba" font-size="25" font-weight="700">Кім орындайды?</text><text x="560" y="236.0" style="fill:#29263e" font-size="23" font-weight="400">Қолмен — адам.</text><text x="560" y="267.05" style="fill:#29263e" font-size="23" font-weight="400">Автоматты — бағдарлама.</text><rect x="35" y="360" width="475" height="190" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="55" y="403.0" style="fill:#7650ba" font-size="25" font-weight="700">Код көріне ме?</text><text x="55" y="451.0" style="fill:#29263e" font-size="23" font-weight="400">Қара жәшік — кодсыз.</text><text x="55" y="482.05" style="fill:#29263e" font-size="23" font-weight="400">Ақ — кодқа сүйеніп.</text><rect x="540" y="360" width="475" height="190" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="560" y="403.0" style="fill:#7650ba" font-size="25" font-weight="700">Қазір не үшін тексереміз?</text><text x="560" y="451.0" style="fill:#29263e" font-size="23" font-weight="400">Smoke, sanity, ретест,</text><text x="560" y="482.05" style="fill:#29263e" font-size="23" font-weight="400">регресс — әртүрлі мақсат.</text><text x="35" y="624.0" style="fill:#29263e" font-size="22" font-weight="400">Бір тексеруде бірнеше осындай белгі болуы мүмкін.</text></svg>
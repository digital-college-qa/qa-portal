" y="505.0" style="fill:#29263e" font-size="24" font-weight="400">Бөлек: нұсқа, тәуекел, кедергі, тексерілмегені.</text><text x="45" y="556.0" style="fill:#29263e" font-size="24" font-weight="400">Сапа қорытындысы дәлелге сүйенеді.</text></svg>
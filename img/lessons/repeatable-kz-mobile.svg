<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 717" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="717" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Әріптес қайталай ала</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">ма?</text><rect x="24" y="127" width="352" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="165" font-size="26" font-weight="700" fill="#a42f38">Деректер жетіспейді</text><text x="44" y="219" font-size="26" font-weight="400" fill="#202637">Сусын қосу.</text><rect x="24" y="369" width="352" height="220" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="407" font-size="26" font-weight="700" fill="#196747">Қайталауға болады</text><text x="44" y="461" font-size="26" font-weight="400" fill="#202637">Латтені таңдау. Саны 2.</text><text x="44" y="496" font-size="26" font-weight="400" fill="#202637">«Себетке» басу.</text><text x="24" y="619" font-size="24" font-weight="700" fill="#6241a5">Әріптесте сол деректер →</text><text x="24" y="652" font-size="24" font-weight="700" fill="#6241a5">сол тексеруді қайталай</text><text x="24" y="685" font-size="24" font-weight="700" fill="#6241a5">алады.</text></svg>

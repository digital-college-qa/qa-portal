<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img"><title>Статусы проверки</title><rect width="1040" height="650" rx="20" fill="#f7f5fc"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#29263e} .mono{font-family:Consolas,monospace}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#7650ba"/></marker></defs><text x="32" y="40.0" style="fill:#7650ba" font-size="16" font-weight="700">УЧЕБНАЯ СХЕМА · QA PORTAL</text><text x="32" y="78.0" style="fill:#29263e" font-size="27" font-weight="700">Статусы проверки</text><rect x="35" y="215" width="225" height="170" rx="13" fill="#eee7fa" stroke="#dbd4e9" stroke-width="2"/><text x="49" y="265.0" style="fill:#7650ba" font-size="24" font-weight="700">Not run</text><text x="49" y="317.0" style="fill:#29263e" font-size="20" font-weight="400">Не запускали</text><rect x="285" y="215" width="225" height="170" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="299" y="265.0" style="fill:#7650ba" font-size="24" font-weight="700">Passed</text><text x="299" y="317.0" style="fill:#29263e" font-size="20" font-weight="400">Совпало</text><rect x="535" y="215" width="225" height="170" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="549" y="265.0" style="fill:#7650ba" font-size="24" font-weight="700">Failed</text><text x="549" y="317.0" style="fill:#29263e" font-size="20" font-weight="400">Расхождение</text><rect x="785" y="215" width="225" height="170" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="799" y="265.0" style="fill:#7650ba" font-size="24" font-weight="700">Blocked</text><text x="799" y="317.0" style="fill:#29263e" font-size="20" font-weight="400">Мешает причина</text><text x="50" y="535.0" style="fill:#29263e" font-size="23" font-weight="400">Статус должен подтверждаться действием и результатом.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 697" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="697" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">«Жылдам» сөзін қалай</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">нақтылау керек</text><rect x="24" y="127" width="352" height="210" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="165" font-size="25" font-weight="700" fill="#6241a5">Оқу талабы REV-2</text><text x="44" y="231" font-size="27" font-weight="400" fill="#202637">«Нәтижелер жылдам</text><text x="44" y="267" font-size="27" font-weight="400" fill="#202637">көрсетіледі».</text><rect x="24" y="359" width="352" height="210" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="397" font-size="25" font-weight="700" fill="#6241a5">Авторға сұрақ</text><text x="44" y="463" font-size="27" font-weight="400" fill="#202637">Нәтижелер неше</text><text x="44" y="499" font-size="27" font-weight="400" fill="#202637">секундта шығуы керек?</text><text x="24" y="599" font-size="24" font-weight="700" fill="#6241a5">Санды автордан</text><text x="24" y="632" font-size="24" font-weight="700" fill="#6241a5">нақтылаймыз. Өзіміз ойлап</text><text x="24" y="665" font-size="24" font-weight="700" fill="#6241a5">таппаймыз.</text></svg>

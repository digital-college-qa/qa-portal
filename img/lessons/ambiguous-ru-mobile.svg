<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 664" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="664" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Как уточнить слово</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">«быстро»</text><rect x="24" y="127" width="352" height="210" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="165" font-size="25" font-weight="700" fill="#6241a5">Учебное требование</text><text x="44" y="199" font-size="25" font-weight="700" fill="#6241a5">REV-2</text><text x="44" y="231" font-size="27" font-weight="400" fill="#202637">«Результаты</text><text x="44" y="267" font-size="27" font-weight="400" fill="#202637">показываются быстро».</text><rect x="24" y="359" width="352" height="210" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="397" font-size="25" font-weight="700" fill="#6241a5">Вопрос автору</text><text x="44" y="463" font-size="27" font-weight="400" fill="#202637">За сколько секунд</text><text x="44" y="499" font-size="27" font-weight="400" fill="#202637">должны появиться</text><text x="44" y="535" font-size="27" font-weight="400" fill="#202637">результаты?</text><text x="24" y="599" font-size="24" font-weight="700" fill="#6241a5">Число уточняем у автора. Не</text><text x="24" y="632" font-size="24" font-weight="700" fill="#6241a5">придумываем сами.</text></svg>

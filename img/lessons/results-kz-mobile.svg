<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 743" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="743" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Күту мен нақты</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">нәтижені</text><text x="24" y="144" font-size="30" font-weight="700" fill="#202637">салыстырамыз</text><rect x="24" y="166" width="352" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="202" font-size="22" font-weight="700" fill="#6241a5">Оқу ережесі</text><text x="44" y="242" font-size="25" font-weight="700" fill="#202637">Сілтеме мәзірді ашады</text><text x="44" y="285" font-size="22" font-weight="400" fill="#566078">Басқаннан кейін:</text><text x="44" y="326" font-size="25" font-weight="700" fill="#202637">Мәзір ашылды</text><text x="44" y="370" font-size="27" font-weight="700" fill="#196747">Passed</text><rect x="24" y="418" width="352" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="454" font-size="22" font-weight="700" fill="#6241a5">Оқу ережесі</text><text x="44" y="494" font-size="25" font-weight="700" fill="#202637">Сілтеме мәзірді ашады</text><text x="44" y="537" font-size="22" font-weight="400" fill="#566078">Басқаннан кейін:</text><text x="44" y="578" font-size="25" font-weight="700" fill="#202637">Басты бет ашылды</text><text x="44" y="622" font-size="27" font-weight="700" fill="#a42f38">Failed</text><text x="24" y="678" font-size="24" font-weight="700" fill="#6241a5">Мәртебе — әсер емес,</text><text x="24" y="711" font-size="24" font-weight="700" fill="#6241a5">салыстыру нәтижесі.</text></svg>

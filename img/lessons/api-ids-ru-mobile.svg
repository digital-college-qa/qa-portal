<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 951" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="951" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Номер напитка и id</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">строки — разные</text><rect x="24" y="127" width="352" height="218" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="163" font-size="25" font-weight="700" fill="#6241a5">Товар в каталоге</text><text x="42" y="201" font-size="24" font-weight="400" fill="#566078">Фрагмент ответа:</text><text x="42" y="239" font-size="24" font-weight="700" fill="#202637">&quot;id&quot;: 4</text><text x="42" y="277" font-size="24" font-weight="400" fill="#202637">Это номер напитка</text><text x="42" y="315" font-size="24" font-weight="400" fill="#202637">4 → Латте</text><rect x="24" y="367" width="352" height="294" rx="16" fill="#fff" stroke="#d9deeb"/><text x="42" y="403" font-size="25" font-weight="700" fill="#6241a5">Строка корзины</text><text x="42" y="441" font-size="24" font-weight="400" fill="#566078">Фрагмент ответа:</text><text x="42" y="479" font-size="24" font-weight="400" fill="#202637">&quot;items&quot;: [</text><text x="42" y="517" font-size="24" font-weight="700" fill="#6241a5">{ &quot;id&quot;: &quot;4-S-0&quot;,</text><text x="42" y="555" font-size="24" font-weight="400" fill="#202637">&quot;productId&quot;: 4,</text><text x="42" y="593" font-size="24" font-weight="400" fill="#202637">&quot;size&quot;: &quot;S&quot; }</text><text x="42" y="631" font-size="24" font-weight="400" fill="#202637">]</text><text x="24" y="691" font-size="24" font-weight="700" fill="#6241a5">↓ Копируем id строки</text><text x="24" y="724" font-size="24" font-weight="700" fill="#6241a5">целиком из items</text><text x="24" y="756" font-size="24" font-weight="700" fill="#196747">DELETE /cart/items/4-S-0</text><text x="24" y="788" font-size="24" font-weight="700" fill="#196747">204 → строка удалена. В</text><text x="24" y="821" font-size="24" font-weight="700" fill="#196747">Postman: /cart/items/{{itemId}}</text><text x="24" y="853" font-size="24" font-weight="700" fill="#6241a5">В нашем клиенте вставляем</text><text x="24" y="886" font-size="24" font-weight="700" fill="#6241a5">id вручную; не собираем его</text><text x="24" y="919" font-size="24" font-weight="700" fill="#6241a5">наугад.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 704" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="480" height="704" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Почему правильный отказ</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">— Passed</text><rect x="24" y="127" width="432" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="167" font-size="25" font-weight="700" fill="#6241a5">Ожидаемый результат</text><text x="44" y="235" font-size="25" font-weight="400" fill="#202637">Без имени заказ не создаётся.</text><text x="44" y="269" font-size="25" font-weight="400" fill="#202637">Форма объясняет почему.</text><rect x="24" y="379" width="432" height="230" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44" y="419" font-size="25" font-weight="700" fill="#6241a5">Фактический результат</text><text x="44" y="487" font-size="25" font-weight="400" fill="#202637">Заказ не создан. Рядом с</text><text x="44" y="521" font-size="25" font-weight="400" fill="#202637">именем — ошибка.</text><text x="24" y="639" font-size="24" font-weight="700" fill="#196747">Совпало → Passed. Отказ был</text><text x="24" y="672" font-size="24" font-weight="700" fill="#196747">ожидаемым.</text></svg>

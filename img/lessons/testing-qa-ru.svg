<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img"><title>Что такое тестирование. QA и QC</title><rect width="1040" height="650" rx="20" fill="#f7f5fc"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#29263e} .mono{font-family:Consolas,monospace}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#7650ba"/></marker></defs><text x="32" y="40.0" style="fill:#7650ba" font-size="16" font-weight="700">УЧЕБНАЯ СХЕМА · QA PORTAL</text><text x="32" y="78.0" style="fill:#29263e" font-size="27" font-weight="700">Что такое тестирование. QA и QC</text><rect x="40" y="160" width="460" height="330" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="64" y="211.0" style="fill:#7650ba" font-size="33" font-weight="700">QA</text><text x="64" y="267.0" style="fill:#29263e" font-size="25" font-weight="400">Процессы: заранее уточнить</text><text x="64" y="300.75" style="fill:#29263e" font-size="25" font-weight="400">правило, договориться о</text><text x="64" y="334.5" style="fill:#29263e" font-size="25" font-weight="400">проверках и ревью.</text><rect x="540" y="160" width="460" height="330" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="564" y="211.0" style="fill:#7650ba" font-size="33" font-weight="700">QC / Testing</text><text x="564" y="267.0" style="fill:#29263e" font-size="25" font-weight="400">Оценка продукта: проверить</text><text x="564" y="300.75" style="fill:#29263e" font-size="25" font-weight="400">требование или сайт и</text><text x="564" y="334.5" style="fill:#29263e" font-size="25" font-weight="400">сообщить о результате.</text><text x="44" y="567.0" style="fill:#29263e" font-size="26" font-weight="400">Качество — общая работа команды.</text></svg>
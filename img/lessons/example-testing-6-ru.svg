<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img"><title>Удаляем один товар</title><rect width="1040" height="650" rx="20" fill="#f7f5fc"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#29263e} .mono{font-family:Consolas,monospace}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#7650ba"/></marker></defs><text x="32" y="40.0" style="fill:#7650ba" font-size="16" font-weight="700">УЧЕБНАЯ СХЕМА · QA PORTAL</text><text x="32" y="78.0" style="fill:#29263e" font-size="27" font-weight="700">Удаляем один товар</text><rect x="30" y="180" width="310" height="330" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="50" y="226.0" style="fill:#7650ba" font-size="24" font-weight="700">Правило</text><text x="50" y="274.0" style="fill:#29263e" font-size="23" font-weight="400">Удаление убирает</text><text x="50" y="305.05" style="fill:#29263e" font-size="23" font-weight="400">только выбранную</text><text x="50" y="336.1" style="fill:#29263e" font-size="23" font-weight="400">строку корзины.</text><path d="M342 338 L362 338" stroke="#7650ba" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="367" y="180" width="310" height="330" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="387" y="226.0" style="fill:#7650ba" font-size="24" font-weight="700">Действие</text><text x="387" y="274.0" style="fill:#29263e" font-size="23" font-weight="400">В корзине капучино и</text><text x="387" y="305.05" style="fill:#29263e" font-size="23" font-weight="400">латте. Удалили строку</text><text x="387" y="336.1" style="fill:#29263e" font-size="23" font-weight="400">с капучино.</text><path d="M679 338 L699 338" stroke="#7650ba" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="704" y="180" width="310" height="330" rx="13" fill="#fff" stroke="#dbd4e9" stroke-width="2"/><text x="724" y="226.0" style="fill:#7650ba" font-size="24" font-weight="700">Ожидание / факт</text><text x="724" y="274.0" style="fill:#29263e" font-size="23" font-weight="400">Останется латте. /</text><text x="724" y="305.05" style="fill:#29263e" font-size="23" font-weight="400">Корзина полностью</text><text x="724" y="336.1" style="fill:#29263e" font-size="23" font-weight="400">очистилась.</text><text x="42" y="572.0" style="fill:#29263e" font-size="24" font-weight="400">Сравниваем. Если правило неясно — сначала вопрос.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 564" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="400" height="564" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Тот же принцип на</text><text x="24" y="105" font-size="30" font-weight="700" fill="#202637">аттракционе</text><text x="24" y="135" font-size="24" font-weight="700" fill="#6241a5">Правило: от 120 до 190</text><text x="24" y="168" font-size="24" font-weight="700" fill="#6241a5">включительно.</text><path d="M24 241H376" stroke="#6241a5" stroke-width="4"/><rect x="24.0" y="192" width="79.0" height="96" rx="14" fill="#fbe9eb" stroke="#a42f38"/><text x="36.0" y="248" font-size="32" font-weight="700" fill="#a42f38">119</text><rect x="115.0" y="192" width="79.0" height="96" rx="14" fill="#e5f1e9" stroke="#196747"/><text x="127.0" y="248" font-size="32" font-weight="700" fill="#196747">120</text><rect x="206.0" y="192" width="79.0" height="96" rx="14" fill="#e5f1e9" stroke="#196747"/><text x="218.0" y="248" font-size="32" font-weight="700" fill="#196747">190</text><rect x="297.0" y="192" width="79.0" height="96" rx="14" fill="#fbe9eb" stroke="#a42f38"/><text x="309.0" y="248" font-size="32" font-weight="700" fill="#a42f38">191</text><text x="24" y="326" font-size="25" font-weight="400" fill="#202637">Меньше 120: не разрешено</text><text x="24" y="370" font-size="25" font-weight="400" fill="#202637">120–190: разрешено</text><text x="24" y="414" font-size="25" font-weight="400" fill="#202637">Больше 190: не разрешено</text><text x="24" y="466" font-size="24" font-weight="700" fill="#6241a5">Цвет — допустимость</text><text x="24" y="499" font-size="24" font-weight="700" fill="#6241a5">значения, не Passed или</text><text x="24" y="532" font-size="24" font-weight="700" fill="#6241a5">Failed.</text></svg>

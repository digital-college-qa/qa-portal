<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="568" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">ОҚУ МЫСАЛЫ</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Әдіс не істеу керегін айтады</text><rect x="24" y="88" width="912" height="96" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="38" y="102" width="118" height="38" rx="8" fill="#eae4f6" stroke="none"/><text x="48" y="129" font-size="24" font-weight="700" fill="#6241a5">GET</text><text x="180" y="126" font-size="25" font-weight="700" fill="#6241a5">/products</text><text x="180" y="164" font-size="24" font-weight="400" fill="#202637">Каталогты алу</text><text x="710" y="126" font-size="24" font-weight="700" fill="#202637">→ Оқу</text><rect x="24" y="198" width="912" height="96" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="38" y="212" width="118" height="38" rx="8" fill="#eae4f6" stroke="none"/><text x="48" y="239" font-size="24" font-weight="700" fill="#6241a5">POST</text><text x="180" y="236" font-size="25" font-weight="700" fill="#6241a5">/cart/items</text><text x="180" y="274" font-size="24" font-weight="400" fill="#202637">Себетке жол қосу</text><text x="710" y="236" font-size="24" font-weight="700" fill="#202637">→ Қосу</text><rect x="24" y="308" width="912" height="96" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="38" y="322" width="118" height="38" rx="8" fill="#eae4f6" stroke="none"/><text x="48" y="349" font-size="24" font-weight="700" fill="#6241a5">PATCH</text><text x="180" y="346" font-size="25" font-weight="700" fill="#6241a5">/products/4</text><text x="180" y="384" font-size="24" font-weight="400" fill="#202637">Латте бағасын өзгерту</text><text x="710" y="346" font-size="24" font-weight="700" fill="#202637">→ Өзгерту</text><rect x="24" y="418" width="912" height="96" rx="16" fill="#fff" stroke="#d9deeb"/><rect x="38" y="432" width="118" height="38" rx="8" fill="#eae4f6" stroke="none"/><text x="48" y="459" font-size="24" font-weight="700" fill="#6241a5">DELETE</text><text x="180" y="456" font-size="25" font-weight="700" fill="#6241a5">/cart</text><text x="180" y="494" font-size="24" font-weight="400" fill="#202637">Себетті тазалау</text><text x="710" y="456" font-size="24" font-weight="700" fill="#202637">→ Жою</text><text x="24" y="536" font-size="24" font-weight="700" fill="#6241a5">Әдіс — әрекет. Жол — қай деректермен жұмыс істейміз.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 497" role="img" font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="497" rx="0" fill="#f5f3fb" stroke="none"/><text x="24" y="30" font-size="17" font-weight="400" fill="#566078">УЧЕБНЫЙ ПРИМЕР</text><text x="24" y="66" font-size="30" font-weight="700" fill="#202637">Одинаковая ошибка — разное влияние</text><text x="24" y="96" font-size="24" font-weight="700" fill="#6241a5">Одна ошибка: поиск не находит товар по названию.</text><rect x="24.0" y="120" width="446.0" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="44.0" y="156" font-size="27" font-weight="700" fill="#6241a5">Маленький магазин</text><text x="44.0" y="204" font-size="24" font-weight="400" fill="#202637">6 товаров. Все видны в меню, есть</text><text x="44.0" y="237" font-size="24" font-weight="400" fill="#202637">обходной путь.</text><text x="44.0" y="287" font-size="24" font-weight="700" fill="#202637">Severity: Minor</text><text x="44.0" y="325" font-size="24" font-weight="700" fill="#202637">Priority: Low</text><rect x="490.0" y="120" width="446.0" height="315" rx="16" fill="#fff" stroke="#d9deeb"/><text x="510.0" y="156" font-size="27" font-weight="700" fill="#6241a5">Большой каталог</text><text x="510.0" y="204" font-size="24" font-weight="400" fill="#202637">10 000 товаров. Поиск — основной</text><text x="510.0" y="237" font-size="24" font-weight="400" fill="#202637">путь к покупке.</text><text x="510.0" y="287" font-size="24" font-weight="700" fill="#202637">Severity: Major</text><text x="510.0" y="325" font-size="24" font-weight="700" fill="#202637">Priority: High</text><text x="24" y="465" font-size="24" font-weight="700" fill="#6241a5">Оценки условные. Сначала узнай шкалу и правила команды.</text></svg>

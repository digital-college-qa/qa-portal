<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" xml:lang="ru">
<title id="title">Scrum: что происходит внутри спринта</title><desc id="desc">Planning, работа с тестированием, Review и Retrospective находятся внутри спринта. Daily Scrum проходит каждый рабочий день.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6981a8"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#f7f9fe" stroke="none"/><text x="44" y="62" font-size="18" fill="#4968ad" font-weight="700">02 / SCRUM</text><text x="44" y="110" font-size="36" fill="#26334d" font-weight="700">Scrum: что происходит внутри спринта</text><text x="44" y="153" font-size="23" fill="#26334d" font-weight="400">Спринт — период фиксированной длины: не больше месяца. Здесь пример на 2 недели.</text><rect x="34" y="194" width="1132" height="295" rx="18" fill="#eaf0ff" stroke="#c9d7f5"/><text x="58" y="233" font-size="25" fill="#365697" font-weight="700">SPRINT / цель: покупатель видит правильную сумму в корзине</text><rect x="58" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="74" y="299" font-size="25" fill="#26334d" font-weight="700">Planning</text><text x="74" y="340" font-size="21" fill="#526079" font-weight="400">Выбрать цель</text><text x="74" y="372" font-size="21" fill="#526079" font-weight="400">и план работы</text><path d="M311 337H330" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="337" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="353" y="299" font-size="25" fill="#26334d" font-weight="700">Работа + QA</text><text x="353" y="340" font-size="21" fill="#526079" font-weight="400">Создавать и проверять</text><text x="353" y="372" font-size="21" fill="#526079" font-weight="400">готовые части продукта</text><path d="M590 337H609" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="616" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="632" y="299" font-size="25" fill="#26334d" font-weight="700">Review</text><text x="632" y="340" font-size="21" fill="#526079" font-weight="400">Обсудить результат</text><text x="632" y="372" font-size="21" fill="#526079" font-weight="400">и обратную связь</text><path d="M869 337H888" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="895" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="911" y="299" font-size="25" fill="#26334d" font-weight="700">Retrospective</text><text x="911" y="340" font-size="21" fill="#526079" font-weight="400">Решить, как улучшить</text><text x="911" y="372" font-size="21" fill="#526079" font-weight="400">работу команды</text><text x="58" y="465" font-size="22" fill="#365697" font-weight="400">Daily Scrum: 15 минут каждый рабочий день, чтобы проверить и скорректировать план.</text><rect x="44" y="518" width="1112" height="68" rx="18" fill="#e3f2ea" stroke="none"/><text x="63" y="548" font-size="24" fill="#2a684b" font-weight="700">Готовая часть продукта (Increment) появляется в течение спринта.</text><text x="63" y="575" font-size="22" fill="#2a684b" font-weight="400">QA входит в Developers: проверка идёт в спринте, а не после него.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" xml:lang="ru">
<title id="title">Agile: короткий путь к обратной связи</title><desc id="desc">Четыре шага: выбрать пользу, сделать часть, проверить, получить отзыв. Обратная связь помогает уточнить следующий шаг.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6981a8"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#f7f9fe" stroke="none"/><text x="44" y="62" font-size="18" fill="#4968ad" font-weight="700">01 / AGILE</text><text x="44" y="110" font-size="36" fill="#26334d" font-weight="700">Agile: короткий путь к обратной связи</text><text x="44" y="153" font-size="24" fill="#26334d" font-weight="400">Общий подход: делаем небольшую полезную часть и учимся на результате.</text><rect x="44" y="211" width="254" height="208" rx="18" fill="white" stroke="#d9e1f0"/><rect x="62" y="229" width="42" height="38" rx="12" fill="#e6edff" stroke="none"/><text x="75" y="257" font-size="22" fill="#26334d" font-weight="700">1</text><text x="62" y="310" font-size="25" fill="#26334d" font-weight="700">Выбрать пользу</text><text x="62" y="352" font-size="21" fill="#526079" font-weight="400">Покупатель хочет</text><text x="62" y="384" font-size="21" fill="#526079" font-weight="400">видеть цену заказа</text><path d="M305 309H322" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="330" y="211" width="254" height="208" rx="18" fill="white" stroke="#d9e1f0"/><rect x="348" y="229" width="42" height="38" rx="12" fill="#e5f3ef" stroke="none"/><text x="361" y="257" font-size="22" fill="#26334d" font-weight="700">2</text><text x="348" y="310" font-size="25" fill="#26334d" font-weight="700">Сделать часть</text><text x="348" y="352" font-size="21" fill="#526079" font-weight="400">Добавить итог</text><text x="348" y="384" font-size="21" fill="#526079" font-weight="400">в корзину</text><path d="M591 309H608" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="616" y="211" width="254" height="208" rx="18" fill="white" stroke="#d9e1f0"/><rect x="634" y="229" width="42" height="38" rx="12" fill="#fff1d9" stroke="none"/><text x="647" y="257" font-size="22" fill="#26334d" font-weight="700">3</text><text x="634" y="310" font-size="25" fill="#26334d" font-weight="700">Проверить</text><text x="634" y="352" font-size="21" fill="#526079" font-weight="400">QA проверяет сумму</text><text x="634" y="384" font-size="21" fill="#526079" font-weight="400">и изменение количества</text><path d="M877 309H894" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="902" y="211" width="254" height="208" rx="18" fill="white" stroke="#d9e1f0"/><rect x="920" y="229" width="42" height="38" rx="12" fill="#eee6fb" stroke="none"/><text x="933" y="257" font-size="22" fill="#26334d" font-weight="700">4</text><text x="920" y="310" font-size="25" fill="#26334d" font-weight="700">Получить отзыв</text><text x="920" y="352" font-size="21" fill="#526079" font-weight="400">Показать покупателю:</text><text x="920" y="384" font-size="21" fill="#526079" font-weight="400">что ещё улучшить?</text><path d="M1028 435V472H172V435" fill="none" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="449" width="536" height="46" rx="10" fill="#f7f9fe" stroke="none"/><text x="357" y="480" font-size="23" fill="#4968ad" font-weight="700">Уточнить следующий шаг по обратной связи</text><text x="44" y="555" font-size="23" fill="#26334d" font-weight="400">Agile — ценности и принципы. Scrum — фреймворк. Kanban — стратегия потока.</text></g></svg>
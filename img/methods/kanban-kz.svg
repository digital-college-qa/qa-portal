<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc" xml:lang="kk">
<title id="title">Kanban: міндеттер көрінеді, жұмыс шектеулі</title><desc id="desc">Кофехана міндеттері бар төрт бағанды тақта. Жұмыста шегі толы: 2/2. Жаңа міндет алу үшін бос орын қажет.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6981a8"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="750" rx="0" fill="#f7f9fe" stroke="none"/><text x="44" y="62" font-size="18" fill="#4968ad" font-weight="700">03 / KANBAN</text><text x="44" y="110" font-size="35" fill="#26334d" font-weight="700">Kanban: міндеттер көрінеді, жұмыс шектеулі</text><text x="44" y="153" font-size="22" fill="#26334d" font-weight="400">Карточка = бір міндет. Баған = оның күйі. WIP = басталған, бірақ аяқталмаған жұмыс.</text><rect x="44" y="197" width="260" height="355" rx="16" fill="#edf1fa" stroke="none"/><text x="60" y="235" font-size="26" fill="#26334d" font-weight="700">Істеу керек</text><text x="60" y="270" font-size="20" fill="#526079" font-weight="700">Міндет кезегі</text><rect x="56" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="69" y="322" font-size="20" fill="#26334d" font-weight="700">Іздеуді қосу</text><text x="69" y="352" font-size="18" fill="#526079" font-weight="400">Міндет #14</text><rect x="56" y="394" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="69" y="425" font-size="20" fill="#26334d" font-weight="700">Қалдықты көрсету</text><text x="69" y="455" font-size="18" fill="#526079" font-weight="400">Міндет #15</text><path d="M310 376H321" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="328" y="197" width="260" height="355" rx="16" fill="#fff0d9" stroke="none"/><text x="344" y="235" font-size="26" fill="#26334d" font-weight="700">Жұмыста</text><text x="344" y="270" font-size="20" fill="#8a550b" font-weight="700">WIP 2 / 2 · шек 2</text><rect x="340" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="353" y="322" font-size="20" fill="#26334d" font-weight="700">Себет сомасы</text><text x="353" y="352" font-size="18" fill="#526079" font-weight="400">Міндет #11</text><rect x="340" y="394" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="353" y="425" font-size="20" fill="#26334d" font-weight="700">Төлем батырмасы</text><text x="353" y="455" font-size="18" fill="#526079" font-weight="400">Міндет #12</text><path d="M594 376H605" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="612" y="197" width="260" height="355" rx="16" fill="#ece6fb" stroke="none"/><text x="628" y="235" font-size="26" fill="#26334d" font-weight="700">Тексеруде</text><text x="628" y="270" font-size="20" fill="#526079" font-weight="700">WIP 1 / 2 · шек 2</text><rect x="624" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="637" y="322" font-size="20" fill="#26334d" font-weight="700">Санды өзгерту</text><text x="637" y="352" font-size="18" fill="#526079" font-weight="400">Міндет #10</text><path d="M878 376H889" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="896" y="197" width="260" height="355" rx="16" fill="#def2e6" stroke="none"/><text x="912" y="235" font-size="26" fill="#26334d" font-weight="700">Дайын</text><text x="912" y="270" font-size="20" fill="#526079" font-weight="700">Нәтиже тексерілді</text><rect x="908" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="921" y="322" font-size="20" fill="#26334d" font-weight="700">Тауар карточкасы</text><text x="921" y="352" font-size="18" fill="#526079" font-weight="400">Міндет #09</text><rect x="44" y="578" width="1112" height="79" rx="18" fill="#eaf0ff" stroke="none"/><text x="64" y="611" font-size="23" fill="#365697" font-weight="700">«Жұмыста» 2 міндет бар: үшіншісін алмаймыз. Алдымен басталғанын аяқтаймыз.</text><text x="64" y="641" font-size="22" fill="#365697" font-weight="400">Бос орын болғанда жаңа міндет аламыз — бұл pull, жұмысты тартып алу.</text><text x="44" y="704" font-size="22" fill="#26334d" font-weight="400">Бұл — бағандар мен шектердің мысалы. Kanban-ды Scrum-мен бірге қолдануға болады.</text></g></svg>
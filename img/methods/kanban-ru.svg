<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc" xml:lang="ru">
<title id="title">Kanban: задачи видны, работа ограничена</title><desc id="desc">Доска из четырёх колонок с задачами кофейни. Лимит В работе заполнен: 2 из 2. Чтобы взять новую задачу, нужно освободить место.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6981a8"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="750" rx="0" fill="#f7f9fe" stroke="none"/><text x="44" y="62" font-size="18" fill="#4968ad" font-weight="700">03 / KANBAN</text><text x="44" y="110" font-size="35" fill="#26334d" font-weight="700">Kanban: задачи видны, работа ограничена</text><text x="44" y="153" font-size="22" fill="#26334d" font-weight="400">Карточка = одна задача. Колонка = её состояние. WIP = начатая, но не законченная работа.</text><rect x="44" y="197" width="260" height="355" rx="16" fill="#edf1fa" stroke="none"/><text x="60" y="235" font-size="26" fill="#26334d" font-weight="700">Сделать</text><text x="60" y="270" font-size="20" fill="#526079" font-weight="700">Очередь задач</text><rect x="56" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="69" y="322" font-size="20" fill="#26334d" font-weight="700">Добавить поиск</text><text x="69" y="352" font-size="18" fill="#526079" font-weight="400">Задача #14</text><rect x="56" y="394" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="69" y="425" font-size="20" fill="#26334d" font-weight="700">Показать остаток</text><text x="69" y="455" font-size="18" fill="#526079" font-weight="400">Задача #15</text><path d="M310 376H321" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="328" y="197" width="260" height="355" rx="16" fill="#fff0d9" stroke="none"/><text x="344" y="235" font-size="26" fill="#26334d" font-weight="700">В работе</text><text x="344" y="270" font-size="20" fill="#8a550b" font-weight="700">WIP 2 / 2 · лимит 2</text><rect x="340" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="353" y="322" font-size="20" fill="#26334d" font-weight="700">Сумма корзины</text><text x="353" y="352" font-size="18" fill="#526079" font-weight="400">Задача #11</text><rect x="340" y="394" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="353" y="425" font-size="20" fill="#26334d" font-weight="700">Кнопка оплаты</text><text x="353" y="455" font-size="18" fill="#526079" font-weight="400">Задача #12</text><path d="M594 376H605" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="612" y="197" width="260" height="355" rx="16" fill="#ece6fb" stroke="none"/><text x="628" y="235" font-size="26" fill="#26334d" font-weight="700">На проверке</text><text x="628" y="270" font-size="20" fill="#526079" font-weight="700">WIP 1 / 2 · лимит 2</text><rect x="624" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="637" y="322" font-size="20" fill="#26334d" font-weight="700">Изменение количества</text><text x="637" y="352" font-size="18" fill="#526079" font-weight="400">Задача #10</text><path d="M878 376H889" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="896" y="197" width="260" height="355" rx="16" fill="#def2e6" stroke="none"/><text x="912" y="235" font-size="26" fill="#26334d" font-weight="700">Готово</text><text x="912" y="270" font-size="20" fill="#526079" font-weight="700">Результат проверен</text><rect x="908" y="291" width="236" height="87" rx="12" fill="white" stroke="#d9e1f0"/><text x="921" y="322" font-size="20" fill="#26334d" font-weight="700">Карточка товара</text><text x="921" y="352" font-size="18" fill="#526079" font-weight="400">Задача #09</text><rect x="44" y="578" width="1112" height="79" rx="18" fill="#eaf0ff" stroke="none"/><text x="64" y="611" font-size="23" fill="#365697" font-weight="700">«В работе» уже 2 задачи: третью не берём. Сначала помогаем завершить начатое.</text><text x="64" y="641" font-size="22" fill="#365697" font-weight="400">Новую задачу берём, когда есть свободное место — это pull, вытягивание работы.</text><text x="44" y="704" font-size="22" fill="#26334d" font-weight="400">Это пример колонок и лимитов. Kanban можно применять вместе со Scrum.</text></g></svg>
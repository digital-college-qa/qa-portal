<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" xml:lang="kk">
<title id="title">Scrum: спринт ішінде не болады</title><desc id="desc">Planning, тестілеумен бірге жұмыс, Review және Retrospective спринт ішінде өтеді. Daily Scrum әр жұмыс күні өтеді.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6981a8"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#f7f9fe" stroke="none"/><text x="44" y="62" font-size="18" fill="#4968ad" font-weight="700">02 / SCRUM</text><text x="44" y="110" font-size="36" fill="#26334d" font-weight="700">Scrum: спринт ішінде не болады</text><text x="44" y="153" font-size="23" fill="#26334d" font-weight="400">Спринт — ұзақтығы тұрақты кезең, бір айдан аспайды. Мұнда 2 апталық мысал.</text><rect x="34" y="194" width="1132" height="295" rx="18" fill="#eaf0ff" stroke="#c9d7f5"/><text x="58" y="233" font-size="25" fill="#365697" font-weight="700">SPRINT / мақсат: сатып алушы себеттегі дұрыс соманы көреді</text><rect x="58" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="74" y="299" font-size="25" fill="#26334d" font-weight="700">Planning</text><text x="74" y="340" font-size="21" fill="#526079" font-weight="400">Мақсат пен жұмыс</text><text x="74" y="372" font-size="21" fill="#526079" font-weight="400">жоспарын таңдау</text><path d="M311 337H330" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="337" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="353" y="299" font-size="25" fill="#26334d" font-weight="700">Жұмыс + QA</text><text x="353" y="340" font-size="21" fill="#526079" font-weight="400">Өнім бөліктерін жасау</text><text x="353" y="372" font-size="21" fill="#526079" font-weight="400">және тексеру</text><path d="M590 337H609" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="616" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="632" y="299" font-size="25" fill="#26334d" font-weight="700">Review</text><text x="632" y="340" font-size="21" fill="#526079" font-weight="400">Нәтиже мен кері</text><text x="632" y="372" font-size="21" fill="#526079" font-weight="400">байланысты талқылау</text><path d="M869 337H888" stroke="#6981a8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="895" y="258" width="247" height="170" rx="18" fill="white" stroke="#d9e1f0"/><text x="911" y="299" font-size="25" fill="#26334d" font-weight="700">Retrospective</text><text x="911" y="340" font-size="21" fill="#526079" font-weight="400">Команда жұмысын</text><text x="911" y="372" font-size="21" fill="#526079" font-weight="400">қалай жақсартуды шешу</text><text x="58" y="465" font-size="22" fill="#365697" font-weight="400">Daily Scrum: әр жұмыс күні 15 минут — жоспарды тексеру және бейімдеу.</text><rect x="44" y="518" width="1112" height="68" rx="18" fill="#e3f2ea" stroke="none"/><text x="63" y="548" font-size="24" fill="#2a684b" font-weight="700">Өнімнің дайын бөлігі (Increment) спринт барысында пайда болады.</text><text x="63" y="575" font-size="22" fill="#2a684b" font-weight="400">QA Developers құрамына кіреді: тексеру спринттен кейін емес, оның ішінде жүреді.</text></g></svg>